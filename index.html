<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>地道英文卡片</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#1f2933;--muted:#7b8794;--line:#ece6da;--accent:#e0a100;--red:#c62828;--green:#2e7d32;--grey:#9e9e9e}
@media (prefers-color-scheme:dark){:root{--bg:#161b22;--card:#1f2933;--ink:#e4e7eb;--muted:#9aa5b1;--line:#323f4b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 16px 24px}
header{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:14px 0}
header h1{font-size:18px;margin:0}
.right{display:flex;align-items:center;gap:4px}
.accent{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.accent button{background:none;color:var(--muted);padding:6px 10px;font-size:13px;border-radius:0}
.accent button.on{background:var(--accent);color:#fff}
button{font:inherit;cursor:pointer;border:none;border-radius:12px}
.link{background:none;color:var(--muted);font-size:15px;padding:6px}
.wrap{width:100%;max-width:520px}
.decks{display:grid;gap:12px}
.deck{background:var(--card);border:1px solid var(--line);padding:18px;text-align:left;color:var(--ink);display:flex;justify-content:space-between;align-items:center;font-size:18px}
.deck small{color:var(--muted);font-size:14px;white-space:nowrap;margin-left:10px}
.clab{font-size:13px;color:var(--muted);font-weight:400;margin-bottom:10px}
.cen{font-size:22px;font-weight:600;line-height:1.45}
.cen u{text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.ctitle{font-size:22px;font-weight:700}
.czh{font-size:16px;color:var(--muted);margin-top:6px}
.cbox{text-align:left;margin-top:4px;color:var(--ink);font-size:15px;line-height:1.6}
.crow{margin-top:12px}.crow b{display:block;font-size:14px;color:var(--accent);margin-bottom:2px}
.ghead{font-size:14px;color:var(--muted);margin:14px 2px 0}
.src{font-size:12px;color:var(--muted);margin-bottom:10px}
.mode{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.mode button{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:8px 12px;font-size:14px}
.mode button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.count{font-size:13px;color:var(--muted);text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:340px;margin:12px 0;padding:28px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;user-select:none;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.zh{font-size:28px;font-weight:600;line-height:1.4}
.hint{margin-top:26px;color:var(--muted);font-size:14px}
.back{width:100%}
.back hr{border:none;border-top:1px solid var(--line);margin:22px 0}
.en{font-size:24px;line-height:1.5}
.en u{text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.play{display:flex;gap:10px;justify-content:center;margin-top:14px}
.play button{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:8px 14px;font-size:15px}
.mine{margin-top:22px;font-size:16px;color:var(--muted);line-height:1.5}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;margin-right:6px;color:#fff;vertical-align:1px}
.tag.x{background:var(--red)}.tag.w{background:var(--grey)}
.note{margin-top:12px;font-size:14px;color:var(--muted);font-style:italic}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions button{padding:16px;font-size:17px;color:#fff}
.again{background:var(--red)}.good{background:var(--green)}
.done{text-align:center;padding:40px 10px}
.done .big{font-size:56px}
.done button{background:var(--accent);color:#fff;padding:14px 22px;font-size:16px;margin-top:16px}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1 id="title">🐰 地道英文卡片</h1><div class="right"><div class="accent" id="accent"><button data-a="us">🇺🇸 美式</button><button data-a="au">🇦🇺 澳式</button></div><button class="link hidden" id="home">← 主题</button></div></header>

<main class="wrap">
  <section id="picker">
    <div class="decks" id="decks"></div>
    <p class="hint" style="text-align:center">点卡片翻面，按 空格 / ← → 也可以</p>
  </section>

  <section id="study" class="hidden">
    <div class="mode" id="modes">
      <button data-m="due" class="on">只练没记住的</button>
      <button data-m="all">全部</button>
      <button data-m="reset">重置进度</button>
      <button id="auto">🔊 翻面自动读</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="count" id="count"></div>

    <div class="card" id="card">
      <div class="src" id="src"></div>
      <div class="zh" id="zh"></div>
      <div class="hint" id="tapHint">先自己说一遍，再点开看答案</div>
      <div class="back hidden" id="back">
        <hr>
        <div class="en" id="en"></div>
        <div class="play"><button id="speak">🔊 播放</button><button id="slow">🐢 慢速</button></div>
        <div class="mine" id="mine"></div>
        <div class="note" id="note"></div>
      </div>
    </div>
    <div class="actions hidden" id="actions">
      <button class="again" id="again">✗ 没想到</button>
      <button class="good" id="good">✓ 说对了</button>
    </div>
    <div class="done hidden" id="done">
      <div class="big">🎉</div>
      <p id="doneText"></p>
      <button id="restart">再来一轮</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\[\[/g,'<u>').replace(/\]\]/g,'</u>');
const plain = s => s.replace(/\[\[|\]\]/g,'');
let accent = localStorage.getItem('fc-accent') || 'us';
let deck, queue = [], cur = null, flipped = false, mode = 'due', total = 0, voice = null;

// progress: { "<deck>:<zh>": level }  level>=2 = 记住了
const KEY = 'efc-progress';
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const save = () => localStorage.setItem(KEY, JSON.stringify(prog));
const k = c => c._deck + ':' + c.zh;
const WKEY = 'efc-wrong';
const wrong = new Set(JSON.parse(localStorage.getItem(WKEY) || '[]'));
const saveWrong = () => localStorage.setItem(WKEY, JSON.stringify([...wrong]));
let LIST = [];
const cache = {};
async function getDeck(id){
  if (!cache[id]){ const d = await (await fetch(`decks/${id}.json`)).json(); d.cards.forEach(c => c._deck = id); cache[id] = d; }
  return cache[id];
}

function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices(), want = accent === 'au' ? ['en-AU','en-GB'] : ['en-US'];
  voice = vs.find(v => v.lang === want[0]) || vs.find(v => v.lang === want[1]) || vs.find(v => v.lang.startsWith('en'));
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const player = new Audio();
const view = c => accent === 'us' ? Object.assign({}, c, c.us || {}, {audio: c.audio_us || c.audio}) : c;
function setAccent(){ document.querySelectorAll('#accent button').forEach(b => b.classList.toggle('on', b.dataset.a === accent)); pickVoice(); }
function play(c, rate){
  c = view(c);
  if (c.audio){
    player.src = c.audio; player.playbackRate = rate; player.preservesPitch = true;
    player.play().catch(() => speak(plain(c.en), rate));
  } else speak(plain(c.en), rate);
}
let auto = localStorage.getItem('fc-auto') === '1';
function setAuto(){ $('auto').classList.toggle('on', auto); }
function speak(text, rate = 1){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice; u.lang = voice ? voice.lang : (accent === 'au' ? 'en-AU' : 'en-US'); u.rate = 0.95 * rate;
  speechSynthesis.speak(u);
}

function renderPicker(){
  const known = id => Object.keys(prog).filter(x => x.startsWith(id + ':') && prog[x] >= 2).length;
  const total = LIST.reduce((n, d) => n + d.count, 0);
  const special = [
    `<button class="deck" data-id="mix"><span>🔀 全部混合</span><small>${total} 张</small></button>`,
    `<button class="deck" data-id="wrong"><span>📕 错题本</span><small>${wrong.size} 张</small></button>`];
  const btn = d => `<button class="deck" data-id="${d.id}"><span>${d.emoji} ${esc(d.title)}</span><small>${known(d.id) ? `记住 ${known(d.id)} / ` : ''}${d.count} 张</small></button>`;
  const phr = LIST.filter(d => d.type !== 'culture'), cul = LIST.filter(d => d.type === 'culture');
  $('decks').innerHTML = special.join('') + `<div class="ghead">🗣️ 地道说法</div>` + phr.map(btn).join('') +
    (cul.length ? `<div class="ghead">🦘 澳洲文化梗</div>` + cul.map(btn).join('') : '');
  document.querySelectorAll('.deck').forEach(b => b.onclick = () => openDeck(b.dataset.id));
}

async function loadIndex(){
  LIST = await (await fetch('decks/index.json')).json();
  renderPicker();
  const want = new URLSearchParams(location.search).get('deck');
  if (want) openDeck(want);
}

async function openDeck(id){
  if (id === 'mix' || id === 'wrong'){
    const all = (await Promise.all(LIST.map(d => getDeck(d.id)))).flatMap(d => d.cards);
    deck = id === 'mix' ? {id, emoji:'🔀', title:'全部混合', cards: all}
                        : {id, emoji:'📕', title:'错题本', cards: all.filter(c => wrong.has(k(c)))};
    if (id === 'wrong') mode = 'all';
  } else deck = await getDeck(id);
  $('title').textContent = `${deck.emoji} ${deck.title}`;
  $('picker').classList.add('hidden'); $('study').classList.remove('hidden'); $('home').classList.remove('hidden');
  history.replaceState(null, '', `?deck=${id}`);
  start();
}

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function start(){
  let cards = deck.cards.slice();
  if (mode === 'due') cards = cards.filter(c => (prog[k(c)]||0) < 2);
  queue = shuffle(cards); total = queue.length;
  $('done').classList.add('hidden'); $('card').classList.remove('hidden');
  next();
}

function next(){
  updateBar();
  if (!queue.length){
    $('card').classList.add('hidden'); $('actions').classList.add('hidden'); $('done').classList.remove('hidden');
    const known = deck.cards.filter(c => (prog[k(c)]||0) >= 2).length;
    $('doneText').textContent = deck.cards.length ? `这一轮练完了！已经记住 ${known} / ${deck.cards.length} 张` : (deck.id === 'wrong' ? '错题本是空的，答错的卡会自动收进来' : '这里还没有卡片');
    return;
  }
  cur = queue[0]; flipped = false;
  render();
  $('back').classList.add('hidden'); $('tapHint').classList.remove('hidden'); $('actions').classList.add('hidden');
}

function render(){
  const v = view(cur);
  const meta = LIST.find(d => d.id === cur._deck);
  $('src').textContent = (deck.id === 'mix' || deck.id === 'wrong') && meta ? `${meta.emoji} ${meta.title}` : '';
  const isC = !!v.what;
  $('again').textContent = isC ? '✗ 不知道' : '✗ 没想到';
  $('good').textContent = isC ? '✓ 我知道' : '✓ 说对了';
  $('tapHint').textContent = isC ? '本地人说这句话，是什么意思？' : '先自己说一遍，再点开看答案';
  if (isC){
    $('zh').innerHTML = `<div class="clab">🎧 你可能会听到</div><div class="cen">${fmt(v.en)}</div>`;
    $('en').innerHTML = `<div class="ctitle">${esc(v.title)}</div><div class="czh">${esc(v.zh)}</div>`;
    const row = (icon, lab, t) => t ? `<div class="crow"><b>${icon} ${lab}</b>${esc(t)}</div>` : '';
    $('mine').innerHTML = `<div class="cbox">${row('📌','是什么',v.what)}${row('🇨🇳','类比',v.analogy)}${row('💬','怎么用',v.use)}${row('✨','冷知识',v.fact)}</div>`;
    $('note').textContent = '';
    return;
  }
  $('zh').textContent = v.zh;
  $('en').innerHTML = fmt(v.en);
  const tag = v.mark === 'x' ? '<span class="tag x">不地道</span>' : '<span class="tag w">能用，但不够自然</span>';
  $('mine').innerHTML = v.mine ? `${tag}你以为的：${esc(v.mine)}` : '';
  $('note').textContent = v.note || '';
}

function flip(){
  if (!cur || flipped) return;
  flipped = true;
  $('back').classList.remove('hidden'); $('tapHint').classList.add('hidden'); $('actions').classList.remove('hidden');
  if (auto) play(cur, 1);
}

function answer(ok){
  if (!flipped) return;
  const c = queue.shift();
  if (ok){ prog[k(c)] = (prog[k(c)]||0) + 1; if (prog[k(c)] >= 2) wrong.delete(k(c)); }
  else { prog[k(c)] = 0; wrong.add(k(c)); queue.splice(Math.min(3, queue.length), 0, c); } // 没记住：过几张再出现
  save(); saveWrong(); next();
}

function updateBar(){
  const doneN = total - queue.length;
  $('prog').style.width = total ? (doneN/total*100)+'%' : '100%';
  $('count').textContent = total ? `${Math.min(doneN+1,total)} / ${total}` : '';
}

$('card').onclick = e => { if (e.target.closest('.play')) return; flip(); };
$('speak').onclick = e => { e.stopPropagation(); play(cur, 1); };
$('slow').onclick = e => { e.stopPropagation(); play(cur, 0.7); };
$('auto').onclick = () => { auto = !auto; localStorage.setItem('fc-auto', auto ? '1' : '0'); setAuto(); if (auto && flipped) play(cur, 1); };
setAuto();
setAccent();
document.querySelectorAll('#accent button').forEach(b => b.onclick = () => {
  accent = b.dataset.a; localStorage.setItem('fc-accent', accent); setAccent();
  if (cur && !$('study').classList.contains('hidden')){ render(); if (flipped && auto) play(cur, 1); }
});
$('again').onclick = () => answer(false);
$('good').onclick = () => answer(true);
$('restart').onclick = () => { mode = 'all'; setMode(); start(); };
$('home').onclick = () => { $('study').classList.add('hidden'); $('picker').classList.remove('hidden'); $('home').classList.add('hidden'); $('title').textContent = '🐰 地道英文卡片'; renderPicker(); history.replaceState(null,'',location.pathname); };
function setMode(){ document.querySelectorAll('#modes button[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === mode)); }
document.querySelectorAll('#modes button[data-m]').forEach(b => b.onclick = () => {
  if (b.dataset.m === 'reset'){ if (!confirm('清空这个主题的进度？')) return; deck.cards.forEach(c => delete prog[k(c)]); save(); mode = 'all'; }
  else mode = b.dataset.m;
  setMode(); start();
});
document.addEventListener('keydown', e => {
  if ($('study').classList.contains('hidden')) return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flipped ? answer(true) : flip(); }
  else if (e.key === 'ArrowLeft') answer(false);
  else if (e.key === 'ArrowRight') answer(true);
  else if (e.key.toLowerCase() === 's' && flipped) play(cur, 1);
});
loadIndex();
</script>
</body>
</html>
